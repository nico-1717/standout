        /* ================================================================

        .sb-fab {

    <button type="button" class="sb-fab" id="sbFab" aria-label="<?php te('sidebar.apri_menu'); ?>">
        <span class="sb-fab-pulse"></span>
        <span class="sb-burger"><span></span><span></span><span></span></span>
    </button>

    <script nonce="<?php echo sec_nonce(); ?>">
    (function () {
        'use strict';

        var sidebar = document.getElementById('sidebar');
        var scrim = document.getElementById('sbScrim');
        var fab = document.getElementById('sbFab');
        if (!sidebar || !scrim || !fab) return;

        var SPRING = 'cubic-bezier(.22,.9,.32,1.14)';
        var EASE = 'cubic-bezier(.4,0,.2,1)';
        var EDGE = 18; // zona in px dal bordo sinistro per iniziare lo swipe di apertura

        var LABEL_OPEN = sidebar.getAttribute('data-label-open') || 'Menu';
        var LABEL_CLOSE = sidebar.getAttribute('data-label-close') || 'Menu';
        var isOpen = false;
        var drag = null;

        function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function widthPx() { return sidebar.getBoundingClientRect().width || 280; }

        /* ============================== APERTURA / CHIUSURA ============================== */
        function triggerLinkStagger() {
            var items = sidebar.querySelectorAll('.sidebar-links li');
            var visible = items;
            sidebar.classList.remove('sb-animate-links');
            void sidebar.offsetWidth; // reflow per poter far ripartire l'animazione ogni volta
            Array.prototype.forEach.call(items, function (li) { li.style.animationDelay = ''; });
            Array.prototype.forEach.call(visible, function (li, i) {
                li.style.animationDelay = (i * 45) + 'ms';
            });
            sidebar.classList.add('sb-animate-links');
        }

        function settleOpen() {
            isOpen = true;
            sidebar.style.transition = 'transform .56s ' + SPRING;
            sidebar.style.transform = 'translateX(0)';
            scrim.style.transition = 'opacity .42s ' + EASE;
            scrim.style.opacity = '1';
            scrim.classList.add('sb-visible');
            fab.classList.add('sb-fab-open');
            fab.setAttribute('aria-label', LABEL_CLOSE);
            document.documentElement.classList.add('sb-locked');
            triggerLinkStagger();
            buzz(12);
        }

        function settleClosed() {
            isOpen = false;
            var w = widthPx();
            sidebar.style.transition = 'transform .4s ' + EASE;
            sidebar.style.transform = 'translateX(-' + w + 'px)';
            scrim.style.transition = 'opacity .34s ' + EASE;
            scrim.style.opacity = '0';
            fab.classList.remove('sb-fab-open');
            fab.setAttribute('aria-label', LABEL_OPEN);
            document.documentElement.classList.remove('sb-locked');
            setTimeout(function () { if (!isOpen) scrim.classList.remove('sb-visible'); }, 360);
            buzz(8);
            scheduleRefresh();
        }

        function toggleSidebar() { if (isOpen) settleClosed(); else settleOpen(); }

        fab.addEventListener('click', toggleSidebar);
        scrim.addEventListener('click', function () { if (isOpen) settleClosed(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen) settleClosed(); });

        /* ============================== TAP SUI LINK ============================== */
        var links = sidebar.querySelectorAll('.sidebar-links li a');
        Array.prototype.forEach.call(links, function (a) {
            a.addEventListener('click', function (e) {
                var href = a.getAttribute('href');
                if (!href) return;
                e.preventDefault();
                buzz(10);
                a.classList.add('sb-tapped');

                var rect = a.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height) * 1.3;
                var ripple = document.createElement('span');
                ripple.className = 'sb-ripple';
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                var ex = (typeof e.clientX === 'number' && e.clientX ? e.clientX : (rect.left + rect.width / 2)) - rect.left - size / 2;
                var ey = (typeof e.clientY === 'number' && e.clientY ? e.clientY : (rect.top + rect.height / 2)) - rect.top - size / 2;
                ripple.style.left = ex + 'px';
                ripple.style.top = ey + 'px';
                a.appendChild(ripple);

                setTimeout(function () { window.location.href = href; }, 150);
            });
        });


        /* ============================== INSERISCI (sotto Flashcards) ============================== */
        /* Universita' o Vocabolario; per il vocabolario la lingua (chiesta
           solo se sono piu' d'una, letta da fc_corsi_lista.php al tocco). Poi
           si va all'elenco delle carte con ?inserisci=1, che apre da solo il
           popup per aggiungere una carta (fc_view.php). */
        (function () {
            var btn = document.getElementById('sbFcIns'), pick = document.getElementById('sbFcPick');
            if (!btn || !pick) return;
            var base = btn.getAttribute('data-base') || '/';
            var stepTipo = pick.querySelector('[data-step="tipo"]'), stepLingua = pick.querySelector('[data-step="lingua"]');
            var lista = document.getElementById('sbFcLingue'), msg = document.getElementById('sbFcMsg');

            function mostra(step) {
                stepTipo.hidden = step !== 'tipo';
                stepLingua.hidden = step !== 'lingua';
                msg.hidden = true;
            }
            function vai(url) { buzz(10); window.location.href = url; }
            /* torna: la pagina di adesso, per tornarci chiuso il popup */
            function torna() { return '&torna=' + encodeURIComponent(window.location.pathname + window.location.search); }
            function apriVocab(id) { vai(base + 'fc/fc_view.php?course=' + encodeURIComponent(id) + '&inserisci=1' + torna()); }

            btn.addEventListener('click', function () {
                var aperto = pick.hidden;
                pick.hidden = !aperto;
                btn.setAttribute('aria-expanded', aperto ? 'true' : 'false');
                if (aperto) mostra('tipo');
                buzz(6);
            });
            pick.addEventListener('click', function (e) {
                var t = e.target.closest ? e.target.closest('button') : null;
                if (!t) return;
                if (t.hasAttribute('data-back')) { mostra('tipo'); return; }
                var tipo = t.getAttribute('data-tipo');
                if (tipo === 'study') { vai(base + 'fc/fc_view.php?inserisci=1' + torna()); return; }
                if (tipo === 'vocab') {
                    t.disabled = true;
                    fetch(base + 'fc/fc_corsi_lista.php', { credentials: 'same-origin', cache: 'no-store' })
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            t.disabled = false;
                            var corsi = (d && d.corsi) || [];
                            if (corsi.length === 1) { apriVocab(corsi[0].id); return; }
                            if (!corsi.length) {
                                stepTipo.hidden = true;
                                msg.innerHTML = '';
                                var a = document.createElement('a');
                                a.href = base + 'fc/fc_home.php';
                                a.textContent = msg.getAttribute('data-vuoto') || '';
                                msg.appendChild(a);
                                msg.hidden = false;
                                return;
                            }
                            lista.innerHTML = '';
                            corsi.forEach(function (c) {
                                var b = document.createElement('button');
                                b.type = 'button';
                                b.className = 'sb-pick-opt';
                                var img = document.createElement('img');
                                img.className = 'sb-pick-flag'; img.src = c.bandiera; img.alt = '';
                                var txt = document.createElement('span');
                                txt.textContent = c.nome;
                                var sub = document.createElement('span');
                                sub.className = 'sb-pick-sub'; sub.textContent = c.da;
                                txt.appendChild(sub);
                                b.appendChild(img); b.appendChild(txt);
                                b.addEventListener('click', function (ev) { ev.stopPropagation(); apriVocab(c.id); });
                                lista.appendChild(b);
                            });
                            mostra('lingua');
                        })
                        .catch(function () { t.disabled = false; vai(base + 'fc/fc_home.php'); });
                }
            });
        })();

        /* Evidenzia la pagina attiva. Una voce con data-sb-match vale per
           tutta una sezione (Flashcards: ogni pagina sotto /fc/); le altre
           si confrontano per percorso intero, perche' lo stesso nome di
           file puo' stare in cartelle diverse. */
        var currentPath = window.location.pathname;
        if (/\/$/.test(currentPath)) currentPath += 'index.php';
        var matched = null;
        Array.prototype.forEach.call(links, function (a) {
            var href = (a.getAttribute('href') || '').split('?')[0];
            var linkPath;
            try { linkPath = new URL(href, window.location.href).pathname; } catch (e) { linkPath = href; }
            if (linkPath === currentPath) matched = a;
        });
        if (!matched) {
            Array.prototype.forEach.call(links, function (a) {
                var pre = a.getAttribute('data-sb-match');
                if (!matched && pre && currentPath.indexOf(pre) !== -1) matched = a;
            });
        }
        if (matched) matched.classList.add('active-link');

        /* ============================== GESTO SWIPE ============================== */
        function setLive(x, alpha) {
            sidebar.style.transition = 'none';
            sidebar.style.transform = 'translateX(' + x + 'px)';
            scrim.style.transition = 'none';
            scrim.style.opacity = String(alpha);
            scrim.classList.add('sb-visible');
        }

        document.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            if (drag) return;
            if (!isOpen) {
                if (e.clientX > EDGE) return;
                var w = widthPx();
                drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, w: w, base: -w, axis: undefined, moved: false, lastX: -w };
            } else {
                if (!sidebar.contains(e.target) && e.target !== scrim) return;
                var w2 = widthPx();
                drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, w: w2, base: 0, axis: undefined, moved: false, lastX: 0 };
            }
        });

        document.addEventListener('pointermove', function (e) {
            if (!drag || e.pointerId !== drag.pid) return;
            var dx = e.clientX - drag.sx;
            var dy = e.clientY - drag.sy;
            if (drag.axis === undefined) {
                if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                drag.axis = (Math.abs(dx) > Math.abs(dy) * 1.15) ? 'h' : 'v';
                if (drag.axis !== 'h') { drag = null; return; }
            }
            e.preventDefault();
            drag.moved = true;
            var x = clamp(drag.base + dx, -drag.w, 0);
            drag.lastX = x;
            var alpha = clamp(1 + x / drag.w, 0, 1);
            setLive(x, alpha);
        }, { passive: false });

        function endDrag(e) {
            if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.pid)) return;
            var d = drag; drag = null;
            if (!d.moved) return;
            var progress = clamp(1 + d.lastX / d.w, 0, 1);
            if (progress >= 0.5) settleOpen(); else settleClosed();
        }
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);

        /* ============================== FAB INTELLIGENTE: AUTO-NASCONDI SU POPUP ==============================
           Invece di gestire lo z-index a mano in ogni pagina, il FAB si nasconde da solo quando
           rileva un popup/modale visibile, sia tramite pattern comuni (dialog, aria-modal, *-overlay...)
           sia geometricamente, controllando cosa c'è "sotto" la sua posizione sullo schermo.
           È comunque disponibile window.SBFab.hide()/.show() come scappatoia manuale per i casi particolari. */

        // Selettori "semantici/espliciti": se matchano e sono visibili, è sicuramente un overlay
        // (comprende anche l'aggancio manuale .sb-popup / data-sb-popup per i casi che l'euristica non copre).
        var EXPLICIT_OVERLAY_SELECTOR = [
            'dialog[open]', '[role="dialog"]', '[role="alertdialog"]', '[aria-modal="true"]',
            '.sb-popup', '[data-sb-popup]'
        ].join(',');

        // Selettori "euristici": pattern comuni di librerie (Bootstrap, SweetAlert2, Toastify) più la
        // convenzione "*-overlay" / "*-scrim" molto diffusa in questo progetto. Passano comunque dal
        // controllo geometrico più severo (looksLikeOverlay) per evitare falsi positivi su piccoli
        // elementi decorativi che si chiamano "overlay" ma non coprono davvero lo schermo.
        var HEURISTIC_OVERLAY_SELECTOR = [
            '.modal.show', '.modal.in', 'body.modal-open .modal',
            '.popup:not([hidden])', '.overlay:not([hidden])',
            '.swal2-container', '.swal2-shown',
            '.Toastify__toast', '.toast.show', '.toast.showing',
            '[class*="-overlay"]', '[class*="-scrim"]'
        ].join(',');

        function isOwnUi(el) {
            return !!el && (el === fab || el === sidebar || el === scrim ||
                (fab.contains && fab.contains(el)) || sidebar.contains(el) || scrim.contains(el));
        }

        // Non tutto quello che copre lo schermo è un popup: certe pagine hanno viste
        // intere disegnate con `position:fixed; inset:0` (la vista mese del planner, per
        // dirne una), che geometricamente sono identiche a un overlay ma sono la pagina.
        // Nascondere lì il FAB significa lasciare l'utente senza menu finché non torna
        // indietro. Chi ha una vista così la dichiara con `data-sb-not-overlay` (o con la
        // classe `.sb-not-overlay`) e l'euristica la salta, insieme a tutto quello che
        // contiene. È una scelta della pagina, quindi non cambia nulla per chi non la usa.
        var NOT_OVERLAY_SELECTOR = '.sb-not-overlay,[data-sb-not-overlay]';
        function isOptedOut(el) {
            return !!(el && el.closest && el.closest(NOT_OVERLAY_SELECTOR));
        }

        function isVisible(el) {
            if (!el || el === document.body || el === document.documentElement) return false;
            var cs = getComputedStyle(el);
            if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) return false;
            var r = el.getBoundingClientRect();
            if (r.width <= 0 || r.height <= 0) return false;
            // Deve intersecare davvero il viewport: un pannello spostato fuori schermo con
            // transform (tipico dei bottom sheet chiusi) resta "opaco" per il CSS ma non è
            // realmente visibile, e non va quindi considerato un overlay attivo.
            if (r.bottom <= 0 || r.right <= 0 || r.top >= window.innerHeight || r.left >= window.innerWidth) return false;
            return true;
        }

        function looksLikeOverlay(el) {
            if (!el || isOwnUi(el) || isOptedOut(el) || !isVisible(el)) return false;
            var cs = getComputedStyle(el);
            if (cs.position !== 'fixed' && cs.position !== 'absolute') return false;
            // Un velo chiuso resta spesso montato a tutto schermo, trasparente e
            // con pointer-events:none (cosi' fa la History con filtri e avvisi):
            // non copre niente e non ferma i tocchi, quindi non e' un popup.
            if (cs.pointerEvents === 'none') return false;
            var z = parseInt(cs.zIndex, 10);
            var r = el.getBoundingClientRect();
            var coversDecentArea = (r.width * r.height) >= (window.innerWidth * window.innerHeight * 0.12);
            return coversDecentArea && !isNaN(z) && z > 0;
        }

        function detectOverlayBySelector() {
            var explicitNodes;
            try { explicitNodes = document.querySelectorAll(EXPLICIT_OVERLAY_SELECTOR); } catch (e) { explicitNodes = []; }
            for (var i = 0; i < explicitNodes.length; i++) {
                if (!isOwnUi(explicitNodes[i]) && !isOptedOut(explicitNodes[i]) && isVisible(explicitNodes[i])) return true;
            }
            var heuristicNodes;
            try { heuristicNodes = document.querySelectorAll(HEURISTIC_OVERLAY_SELECTOR); } catch (e) { heuristicNodes = []; }
            for (var h = 0; h < heuristicNodes.length; h++) {
                if (looksLikeOverlay(heuristicNodes[h])) return true;
            }
            return false;
        }

        function detectOverlayUnderFab() {
            if (!document.elementsFromPoint) return false;
            var r = fab.getBoundingClientRect();
            var pts = [
                [r.left + r.width / 2, r.top + r.height / 2],
                [r.left + 4, r.top + 4], [r.right - 4, r.top + 4],
                [r.left + 4, r.bottom - 4], [r.right - 4, r.bottom - 4]
            ];
            for (var i = 0; i < pts.length; i++) {
                // elementsFromPoint restituisce già tutta la catena di antenati nel punto, dal più
                // esterno al più interno: basta scandirla tutta (niente "break" al primo elemento,
                // altrimenti si rischia di fermarsi su un ramo del DOM che non porta all'overlay).
                var stack = document.elementsFromPoint(pts[i][0], pts[i][1]);
                for (var j = 0; j < stack.length; j++) {
                    if (isOwnUi(stack[j])) continue;
                    if (looksLikeOverlay(stack[j])) return true;
                }
            }
            return false;
        }

        var fabSuppressed = false;
        function setFabSuppressed(state) {
            if (state === fabSuppressed) return;
            fabSuppressed = state;
            fab.classList.toggle('sb-fab-suppressed', state);
            fab.setAttribute('aria-hidden', state ? 'true' : 'false');
            fab.tabIndex = state ? -1 : 0;
        }

        function refreshAutoDetect() {
            // Mentre la sidebar è aperta il FAB è il tasto "chiudi": resta sempre visibile,
            // anche perché lo scrim copre già il resto della pagina.
            if (isOpen) { setFabSuppressed(false); return; }
            setFabSuppressed(detectOverlayBySelector() || detectOverlayUnderFab());
        }

        var refreshScheduled = false;
        function scheduleRefresh() {
            if (refreshScheduled) return;
            refreshScheduled = true;
            requestAnimationFrame(function () { refreshScheduled = false; refreshAutoDetect(); });
        }

        var fabObserver = new MutationObserver(scheduleRefresh);
        fabObserver.observe(document.body, {
            childList: true, subtree: true, attributes: true,
            attributeFilter: ['style', 'class', 'open', 'hidden', 'aria-hidden']
        });
        window.addEventListener('resize', scheduleRefresh);
        setInterval(function () { if (document.visibilityState === 'visible') scheduleRefresh(); }, 1000);
        scheduleRefresh();

        // Scappatoia manuale, utile se una pagina ha un popup che l'euristica non riconosce
        window.SBFab = { hide: function () { setFabSuppressed(true); }, show: function () { setFabSuppressed(false); }, refresh: refreshAutoDetect };

        /* ============================== SUGGERIMENTO UNA TANTUM ============================== */
        (function () {
            var seen = false;
            try { seen = !!localStorage.getItem('fcSidebarHintSeen'); } catch (e) { seen = true; }
            if (seen) return;
            setTimeout(function () {
                fab.classList.add('sb-fab-hint');
                setTimeout(function () {
                    fab.classList.remove('sb-fab-hint');
                    try { localStorage.setItem('fcSidebarHintSeen', '1'); } catch (e) {}
                }, 3500);
            }, 700);
        })();
    })();
    </script>
