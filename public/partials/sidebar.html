<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --sb-bg: rgba(23, 23, 27, .88);
            --sb-hover: rgba(255, 255, 255, .07);
            --sb-active-hover: rgba(255, 255, 255, .14);
            --sb-text: #f5f6f8;
            --sb-muted: #8b8b93;
            --sb-hairline: rgba(255, 255, 255, .08);
            --sb-accent: #0A84FF;
            --sb-accent-2: #7c4dff;
            --sb-spring: cubic-bezier(.22, .9, .32, 1.14);
            --sb-ease: cubic-bezier(.4, 0, .2, 1);
        }

        html.sb-locked, html.sb-locked body { overflow: hidden !important; }

        /* ================================================================
           SCRIM — sfondo sfocato dietro al drawer
           ================================================================ */
        .sb-scrim {
            position: fixed; inset: 0; z-index: 9997;
            background-color: rgba(0, 0, 0, .48);
            -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none;
        }
        .sb-scrim.sb-visible { pointer-events: auto; }

        /* ================================================================
           PANNELLO SIDEBAR
           ================================================================ */
        .sidebar {
            position: fixed; top: 0; left: 0; z-index: 9998;
            width: min(280px, 84vw);
            height: 100vh; height: 100dvh;
            background: var(--sb-bg);
            -webkit-backdrop-filter: blur(30px) saturate(1.7);
            backdrop-filter: blur(30px) saturate(1.7);
            box-shadow: 14px 0 44px rgba(0, 0, 0, .38);
            display: flex; flex-direction: column;
            transform: translateX(-105%);
            -webkit-user-select: none; user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
        }

        .sidebar *,
        .sidebar *::before,
        .sidebar *::after {
            box-sizing: border-box;
        }

        .sidebar-brand {
            padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px 18px;
            font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em;
            color: var(--sb-text);
            border-bottom: 1px solid var(--sb-hairline);
            display: flex; align-items: center; gap: 11px; flex-shrink: 0;
        }
        .sidebar-brand .sb-brand-icon {
            width: 22px; height: 22px; flex-shrink: 0; color: var(--sb-accent);
            filter: drop-shadow(0 2px 8px rgba(10, 132, 255, .45));
        }
        .sidebar-brand .sb-brand-icon svg { width: 100%; height: 100%; display: block; }

        .sidebar-content {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
            /* spazio extra in fondo per non finire mai sotto al FAB (56px + 18px di offset + margine) */
            padding: 14px 0 calc(env(safe-area-inset-bottom, 0px) + 96px);
        }
        .sidebar-content::-webkit-scrollbar { width: 4px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 10px; }

        .sidebar-section-title {
            font-size: .7rem; text-transform: uppercase; letter-spacing: 1.6px;
            color: var(--sb-muted); padding: 16px 22px 8px; font-weight: 800;
        }

        .sidebar-links { list-style-type: none; padding: 0; margin: 0; }
        .sidebar-links li { margin: 3px 12px; }

        .sidebar.sb-animate-links .sidebar-links li {
            animation: sbLinkIn .5s var(--sb-spring) both;
        }
        @keyframes sbLinkIn {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .sidebar-links li a {
            position: relative; display: flex; align-items: center; gap: 13px;
            padding: 13px 16px; min-height: 46px;
            color: rgba(255, 255, 255, .82); text-decoration: none;
            border-radius: 13px; font-weight: 500; font-size: .95rem;
            overflow: hidden; -webkit-tap-highlight-color: transparent;
            transition: background-color .25s var(--sb-ease), color .25s var(--sb-ease),
                        transform .25s var(--sb-spring), box-shadow .3s var(--sb-ease);
        }
        .sidebar-links li a .sb-ic {
            display: inline-flex; align-items: center; justify-content: center;
            width: 19px; height: 19px; flex-shrink: 0; color: rgba(255, 255, 255, .68);
            transition: transform .35s var(--sb-spring), color .25s var(--sb-ease);
        }
        .sidebar-links li a .sb-ic svg { width: 100%; height: 100%; display: block; }
        .sidebar-links li a:hover .sb-ic { color: rgba(255, 255, 255, .9); }
        .sidebar-links li a.active-link .sb-ic { color: #fff; }
        .sidebar-links li a:active { transform: scale(.965); background-color: var(--sb-hover); }
        .sidebar-links li a.sb-tapped { background-color: var(--sb-active-hover); }
        .sidebar-links li a.sb-tapped .sb-ic { transform: scale(1.3) rotate(-10deg); }

        .sb-ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .38);
            transform: scale(0); opacity: .55; pointer-events: none;
            animation: sbRipple .6s ease-out forwards;
        }
        @keyframes sbRipple { to { transform: scale(2.6); opacity: 0; } }

        .sidebar-links li a.active-link {
            background: linear-gradient(135deg, var(--sb-accent), var(--sb-accent-2));
            color: #fff; font-weight: 700;
            box-shadow: 0 6px 18px -4px rgba(10, 132, 255, .55);
        }
        .sidebar.sb-animate-links .sidebar-links li a.active-link {
            animation: sbLinkIn .5s var(--sb-spring) both, sbActivePulse 1.6s ease-out .55s;
        }
        @keyframes sbActivePulse {
            0%, 100% { box-shadow: 0 6px 18px -4px rgba(10, 132, 255, .55); }
            50%      { box-shadow: 0 8px 28px -2px rgba(10, 132, 255, .85); }
        }

        .sidebar-divider { height: 1px; background-color: var(--sb-hairline); margin: 14px 22px; border: none; }

        /* ================================================================
           ACCORDION — Flashcards: Lingua / Studio
           ================================================================ */
        .sb-accordion + .sb-accordion { margin-top: 2px; }

        .sb-accordion-trigger {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            width: calc(100% - 24px); margin: 0 12px;
            background: none; border: none; cursor: pointer; text-align: left;
            padding: 11px 14px; border-radius: 12px;
            color: rgba(255, 255, 255, .86); font-weight: 700; font-size: .82rem;
            letter-spacing: .8px; text-transform: uppercase; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            transition: background-color .25s var(--sb-ease), color .25s var(--sb-ease);
        }
        .sb-accordion-trigger:active { background-color: var(--sb-hover); }
        .sb-accordion.sb-expanded .sb-accordion-trigger { color: #fff; background-color: var(--sb-hover); }

        .sb-chevron {
            width: 15px; height: 15px; flex-shrink: 0; color: var(--sb-muted);
            transition: transform .35s var(--sb-spring), color .25s var(--sb-ease);
        }
        .sb-accordion.sb-expanded .sb-chevron { transform: rotate(90deg); color: rgba(255, 255, 255, .9); }

        .sb-accordion-panel {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows .38s var(--sb-spring);
        }
        .sb-accordion.sb-expanded .sb-accordion-panel { grid-template-rows: 1fr; }
        .sb-accordion-inner { overflow: hidden; min-height: 0; }
        .sb-accordion-inner .sidebar-links { padding: 4px 0 2px; }
        .sb-accordion-inner .sidebar-links li { margin: 3px 12px 3px 24px; }

        /* pallino rosso: notifiche di amicizia in sospeso */
        .sb-badge {
            margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px;
            border-radius: 999px; background: #FF3B30; color: #fff;
            font-size: 11.5px; font-weight: 800; line-height: 20px; text-align: center;
            box-shadow: 0 3px 10px rgba(255, 59, 48, .5);
        }
        .sb-badge[hidden] { display: none; }
        .sb-fab.sb-has-dot::after {
            content: ""; position: absolute; top: 10px; right: 10px;
            width: 11px; height: 11px; border-radius: 50%; background: #FF3B30;
            box-shadow: 0 0 0 2.5px rgba(27, 27, 32, .95);
        }

        /* ================================================================
           FAB — pulsante per aprire/chiudere
           ================================================================ */
        .sb-fab {
            position: fixed; z-index: 10000;
            left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(27, 27, 32, .82);
            -webkit-backdrop-filter: blur(18px) saturate(1.7);
            backdrop-filter: blur(18px) saturate(1.7);
            border: 1px solid rgba(255, 255, 255, .09);
            box-shadow: 0 10px 28px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .08);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0;
            opacity: 1;
            transition: transform .3s var(--sb-spring), box-shadow .3s var(--sb-ease), opacity .25s var(--sb-ease);
            -webkit-tap-highlight-color: transparent;
        }
        .sb-fab:active { transform: scale(.87); }

        /* Nascosto automaticamente quando la pagina mostra un popup/modale sotto di lui */
        .sb-fab.sb-fab-suppressed {
            opacity: 0;
            transform: scale(.7);
            pointer-events: none;
        }

        .sb-burger { width: 20px; height: 14px; position: relative; }
        .sb-burger span {
            position: absolute; left: 0; width: 100%; height: 2px; border-radius: 2px;
            background: #fff;
            transition: transform .4s var(--sb-spring), opacity .2s var(--sb-ease), top .4s var(--sb-spring);
        }
        .sb-burger span:nth-child(1) { top: 0; }
        .sb-burger span:nth-child(2) { top: 6px; }
        .sb-burger span:nth-child(3) { top: 12px; }
        .sb-fab.sb-fab-open .sb-burger span:nth-child(1) { top: 6px; transform: rotate(45deg); }
        .sb-fab.sb-fab-open .sb-burger span:nth-child(2) { opacity: 0; transform: translateX(-8px); }
        .sb-fab.sb-fab-open .sb-burger span:nth-child(3) { top: 6px; transform: rotate(-45deg); }

        .sb-fab-pulse { position: absolute; inset: 0; border-radius: 50%; }
        .sb-fab.sb-fab-hint .sb-fab-pulse {
            animation: sbFabPulse 1.7s var(--sb-ease) 2;
        }
        @keyframes sbFabPulse {
            0%   { box-shadow: 0 0 0 0 rgba(10, 132, 255, .5); }
            100% { box-shadow: 0 0 0 18px rgba(10, 132, 255, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
        }
    </style>
</head>

    <script>
    (function () {
        'use strict';

        var sidebar = document.getElementById('sidebar');
        var scrim = document.getElementById('sbScrim');
        var fab = document.getElementById('sbFab');
        if (!sidebar || !scrim || !fab) return;

        var SPRING = 'cubic-bezier(.22,.9,.32,1.14)';
        var EASE = 'cubic-bezier(.4,0,.2,1)';
        var EDGE = 18; // zona in px dal bordo sinistro per iniziare lo swipe di apertura

        var isOpen = false;
        var drag = null;

        function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function widthPx() { return sidebar.getBoundingClientRect().width || 280; }

        /* ============================== APERTURA / CHIUSURA ============================== */
        function triggerLinkStagger() {
            var items = sidebar.querySelectorAll('.sidebar-links li');
            // conta per il ritardo solo le voci davvero visibili ora: quelle dentro un
            // accordion chiuso non vanno considerate, altrimenti "rubano" indice e ritardano
            // inutilmente le voci principali che vengono dopo (es. Progetti, Amici) dando
            // la sensazione di lag.
            var visible = Array.prototype.filter.call(items, function (li) {
                var acc = li.closest ? li.closest('.sb-accordion') : null;
                return !acc || acc.classList.contains('sb-expanded');
            });
            sidebar.classList.remove('sb-animate-links');
            void sidebar.offsetWidth; // reflow per poter far ripartire l'animazione ogni volta
            Array.prototype.forEach.call(items, function (li) { li.style.animationDelay = ''; });
            Array.prototype.forEach.call(visible, function (li, i) {
                li.style.animationDelay = (i * 45) + 'ms';
            });
            sidebar.classList.add('sb-animate-links');
        }

        function settleOpen() {
            isOpen = true;
            sidebar.style.transition = 'transform .56s ' + SPRING;
            sidebar.style.transform = 'translateX(0)';
            scrim.style.transition = 'opacity .42s ' + EASE;
            scrim.style.opacity = '1';
            scrim.classList.add('sb-visible');
            fab.classList.add('sb-fab-open');
            fab.setAttribute('aria-label', 'Chiudi menu');
            document.documentElement.classList.add('sb-locked');
            triggerLinkStagger();
            buzz(12);
        }

        function settleClosed() {
            isOpen = false;
            var w = widthPx();
            sidebar.style.transition = 'transform .4s ' + EASE;
            sidebar.style.transform = 'translateX(-' + w + 'px)';
            scrim.style.transition = 'opacity .34s ' + EASE;
            scrim.style.opacity = '0';
            fab.classList.remove('sb-fab-open');
            fab.setAttribute('aria-label', 'Apri menu');
            document.documentElement.classList.remove('sb-locked');
            setTimeout(function () { if (!isOpen) scrim.classList.remove('sb-visible'); }, 360);
            buzz(8);
            scheduleRefresh();
        }

        function toggleSidebar() { if (isOpen) settleClosed(); else settleOpen(); }

        fab.addEventListener('click', toggleSidebar);
        scrim.addEventListener('click', function () { if (isOpen) settleClosed(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen) settleClosed(); });

        /* ============================== TAP SUI LINK ============================== */
        var links = sidebar.querySelectorAll('.sidebar-links li a');
        Array.prototype.forEach.call(links, function (a) {
            a.addEventListener('click', function (e) {
                var href = a.getAttribute('href');
                if (!href) return;
                e.preventDefault();
                buzz(10);
                a.classList.add('sb-tapped');

                var rect = a.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height) * 1.3;
                var ripple = document.createElement('span');
                ripple.className = 'sb-ripple';
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                var ex = (typeof e.clientX === 'number' && e.clientX ? e.clientX : (rect.left + rect.width / 2)) - rect.left - size / 2;
                var ey = (typeof e.clientY === 'number' && e.clientY ? e.clientY : (rect.top + rect.height / 2)) - rect.top - size / 2;
                ripple.style.left = ex + 'px';
                ripple.style.top = ey + 'px';
                a.appendChild(ripple);

                setTimeout(function () { window.location.href = href; }, 150);
            });
        });

        /* ============================== ACCORDION LINGUA / STUDIO ============================== */
        var accordionItems = sidebar.querySelectorAll('.sb-accordion');
        function setAccordionExpanded(acc, expanded) {
            acc.classList.toggle('sb-expanded', expanded);
            var trigger = acc.querySelector('.sb-accordion-trigger');
            if (trigger) trigger.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        }
        Array.prototype.forEach.call(accordionItems, function (acc) {
            var trigger = acc.querySelector('.sb-accordion-trigger');
            if (!trigger) return;
            trigger.addEventListener('click', function () {
                var willOpen = !acc.classList.contains('sb-expanded');
                buzz(8);
                // aprirne una chiude automaticamente l'altra
                Array.prototype.forEach.call(accordionItems, function (other) {
                    if (other !== acc) setAccordionExpanded(other, false);
                });
                setAccordionExpanded(acc, willOpen);
            });
        });

        /* Evidenzia automaticamente la pagina attiva */
        var currentFilename = window.location.pathname.split('/').pop();
        if (!currentFilename) currentFilename = 'index.php';
        Array.prototype.forEach.call(links, function (a) {
            var hrefFilename = (a.getAttribute('href') || '').split('?')[0].split('/').pop();
            if (currentFilename === hrefFilename) {
                a.classList.add('active-link');
                var parentAcc = a.closest ? a.closest('.sb-accordion') : null;
                if (parentAcc) setAccordionExpanded(parentAcc, true);
            }
        });

        /* ============================== GESTO SWIPE ============================== */
        function setLive(x, alpha) {
            sidebar.style.transition = 'none';
            sidebar.style.transform = 'translateX(' + x + 'px)';
            scrim.style.transition = 'none';
            scrim.style.opacity = String(alpha);
            scrim.classList.add('sb-visible');
        }

        document.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            if (drag) return;
            if (!isOpen) {
                if (e.clientX > EDGE) return;
                var w = widthPx();
                drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, w: w, base: -w, axis: undefined, moved: false, lastX: -w };
            } else {
                if (!sidebar.contains(e.target) && e.target !== scrim) return;
                var w2 = widthPx();
                drag = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, w: w2, base: 0, axis: undefined, moved: false, lastX: 0 };
            }
        });

        document.addEventListener('pointermove', function (e) {
            if (!drag || e.pointerId !== drag.pid) return;
            var dx = e.clientX - drag.sx;
            var dy = e.clientY - drag.sy;
            if (drag.axis === undefined) {
                if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                drag.axis = (Math.abs(dx) > Math.abs(dy) * 1.15) ? 'h' : 'v';
                if (drag.axis !== 'h') { drag = null; return; }
            }
            e.preventDefault();
            drag.moved = true;
            var x = clamp(drag.base + dx, -drag.w, 0);
            drag.lastX = x;
            var alpha = clamp(1 + x / drag.w, 0, 1);
            setLive(x, alpha);
        }, { passive: false });

        function endDrag(e) {
            if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.pid)) return;
            var d = drag; drag = null;
            if (!d.moved) return;
            var progress = clamp(1 + d.lastX / d.w, 0, 1);
            if (progress >= 0.5) settleOpen(); else settleClosed();
        }
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);

        /* ============================== FAB INTELLIGENTE: AUTO-NASCONDI SU POPUP ==============================
           Invece di gestire lo z-index a mano in ogni pagina, il FAB si nasconde da solo quando
           rileva un popup/modale visibile, sia tramite pattern comuni (dialog, aria-modal, *-overlay...)
           sia geometricamente, controllando cosa c'è "sotto" la sua posizione sullo schermo.
           È comunque disponibile window.SBFab.hide()/.show() come scappatoia manuale per i casi particolari. */

        // Selettori "semantici/espliciti": se matchano e sono visibili, è sicuramente un overlay
        // (comprende anche l'aggancio manuale .sb-popup / data-sb-popup per i casi che l'euristica non copre).
        var EXPLICIT_OVERLAY_SELECTOR = [
            'dialog[open]', '[role="dialog"]', '[role="alertdialog"]', '[aria-modal="true"]',
            '.sb-popup', '[data-sb-popup]'
        ].join(',');

        // Selettori "euristici": pattern comuni di librerie (Bootstrap, SweetAlert2, Toastify) più la
        // convenzione "*-overlay" / "*-scrim" molto diffusa in questo progetto. Passano comunque dal
        // controllo geometrico più severo (looksLikeOverlay) per evitare falsi positivi su piccoli
        // elementi decorativi che si chiamano "overlay" ma non coprono davvero lo schermo.
        var HEURISTIC_OVERLAY_SELECTOR = [
            '.modal.show', '.modal.in', 'body.modal-open .modal',
            '.popup:not([hidden])', '.overlay:not([hidden])',
            '.swal2-container', '.swal2-shown',
            '.Toastify__toast', '.toast.show', '.toast.showing',
            '[class*="-overlay"]', '[class*="-scrim"]'
        ].join(',');

        function isOwnUi(el) {
            return !!el && (el === fab || el === sidebar || el === scrim ||
                (fab.contains && fab.contains(el)) || sidebar.contains(el) || scrim.contains(el));
        }

        // Non tutto quello che copre lo schermo è un popup: certe pagine hanno viste
        // intere disegnate con `position:fixed; inset:0` (la vista mese del planner, per
        // dirne una), che geometricamente sono identiche a un overlay ma sono la pagina.
        // Nascondere lì il FAB significa lasciare l'utente senza menu finché non torna
        // indietro. Chi ha una vista così la dichiara con `data-sb-not-overlay` (o con la
        // classe `.sb-not-overlay`) e l'euristica la salta, insieme a tutto quello che
        // contiene. È una scelta della pagina, quindi non cambia nulla per chi non la usa.
        var NOT_OVERLAY_SELECTOR = '.sb-not-overlay,[data-sb-not-overlay]';
        function isOptedOut(el) {
            return !!(el && el.closest && el.closest(NOT_OVERLAY_SELECTOR));
        }

        function isVisible(el) {
            if (!el || el === document.body || el === document.documentElement) return false;
            var cs = getComputedStyle(el);
            if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) return false;
            var r = el.getBoundingClientRect();
            if (r.width <= 0 || r.height <= 0) return false;
            // Deve intersecare davvero il viewport: un pannello spostato fuori schermo con
            // transform (tipico dei bottom sheet chiusi) resta "opaco" per il CSS ma non è
            // realmente visibile, e non va quindi considerato un overlay attivo.
            if (r.bottom <= 0 || r.right <= 0 || r.top >= window.innerHeight || r.left >= window.innerWidth) return false;
            return true;
        }

        function looksLikeOverlay(el) {
            if (!el || isOwnUi(el) || isOptedOut(el) || !isVisible(el)) return false;
            var cs = getComputedStyle(el);
            if (cs.position !== 'fixed' && cs.position !== 'absolute') return false;
            var z = parseInt(cs.zIndex, 10);
            var r = el.getBoundingClientRect();
            var coversDecentArea = (r.width * r.height) >= (window.innerWidth * window.innerHeight * 0.12);
            return coversDecentArea && !isNaN(z) && z > 0;
        }

        function detectOverlayBySelector() {
            var explicitNodes;
            try { explicitNodes = document.querySelectorAll(EXPLICIT_OVERLAY_SELECTOR); } catch (e) { explicitNodes = []; }
            for (var i = 0; i < explicitNodes.length; i++) {
                if (!isOwnUi(explicitNodes[i]) && !isOptedOut(explicitNodes[i]) && isVisible(explicitNodes[i])) return true;
            }
            var heuristicNodes;
            try { heuristicNodes = document.querySelectorAll(HEURISTIC_OVERLAY_SELECTOR); } catch (e) { heuristicNodes = []; }
            for (var h = 0; h < heuristicNodes.length; h++) {
                if (looksLikeOverlay(heuristicNodes[h])) return true;
            }
            return false;
        }

        function detectOverlayUnderFab() {
            if (!document.elementsFromPoint) return false;
            var r = fab.getBoundingClientRect();
            var pts = [
                [r.left + r.width / 2, r.top + r.height / 2],
                [r.left + 4, r.top + 4], [r.right - 4, r.top + 4],
                [r.left + 4, r.bottom - 4], [r.right - 4, r.bottom - 4]
            ];
            for (var i = 0; i < pts.length; i++) {
                // elementsFromPoint restituisce già tutta la catena di antenati nel punto, dal più
                // esterno al più interno: basta scandirla tutta (niente "break" al primo elemento,
                // altrimenti si rischia di fermarsi su un ramo del DOM che non porta all'overlay).
                var stack = document.elementsFromPoint(pts[i][0], pts[i][1]);
                for (var j = 0; j < stack.length; j++) {
                    if (isOwnUi(stack[j])) continue;
                    if (looksLikeOverlay(stack[j])) return true;
                }
            }
            return false;
        }

        var fabSuppressed = false;
        function setFabSuppressed(state) {
            if (state === fabSuppressed) return;
            fabSuppressed = state;
            fab.classList.toggle('sb-fab-suppressed', state);
            fab.setAttribute('aria-hidden', state ? 'true' : 'false');
            fab.tabIndex = state ? -1 : 0;
        }

        function refreshAutoDetect() {
            // Mentre la sidebar è aperta il FAB è il tasto "chiudi": resta sempre visibile,
            // anche perché lo scrim copre già il resto della pagina.
            if (isOpen) { setFabSuppressed(false); return; }
            setFabSuppressed(detectOverlayBySelector() || detectOverlayUnderFab());
        }

        var refreshScheduled = false;
        function scheduleRefresh() {
            if (refreshScheduled) return;
            refreshScheduled = true;
            requestAnimationFrame(function () { refreshScheduled = false; refreshAutoDetect(); });
        }

        var fabObserver = new MutationObserver(scheduleRefresh);
        fabObserver.observe(document.body, {
            childList: true, subtree: true, attributes: true,
            attributeFilter: ['style', 'class', 'open', 'hidden', 'aria-hidden']
        });
        window.addEventListener('resize', scheduleRefresh);
        setInterval(function () { if (document.visibilityState === 'visible') scheduleRefresh(); }, 1000);
        scheduleRefresh();

        // Scappatoia manuale, utile se una pagina ha un popup che l'euristica non riconosce
        window.SBFab = { hide: function () { setFabSuppressed(true); }, show: function () { setFabSuppressed(false); }, refresh: refreshAutoDetect };

        /* ============================== SUGGERIMENTO UNA TANTUM ============================== */
        (function () {
            var seen = false;
            try { seen = !!localStorage.getItem('fcSidebarHintSeen'); } catch (e) { seen = true; }
            if (seen) return;
            setTimeout(function () {
                fab.classList.add('sb-fab-hint');
                setTimeout(function () {
                    fab.classList.remove('sb-fab-hint');
                    try { localStorage.setItem('fcSidebarHintSeen', '1'); } catch (e) {}
                }, 3500);
            }, 700);
        })();
    })();
    </script>
</body>
</html>
